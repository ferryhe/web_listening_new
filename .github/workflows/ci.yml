name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and development tools
        run: python -m pip install -e ".[dev,rest,mcp]"

      - name: Verify interface dependencies
        run: python -c "import fastapi, mcp"

      - name: Run interface tests
        run: |
          python -m pytest -q tests/interfaces/test_rest.py
          python -m pytest -q tests/interfaces/test_mcp.py

      - name: Run quality gates
        run: |
          python -m pytest -q tests/test_package_smoke.py
          python -m pytest -q
          python -m black --check src tests
          python -m isort --check-only src tests
          python -m pylint src/web_listening tests
          git diff --check
