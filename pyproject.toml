[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-listening"
version = "0.1.0"
description = "Governed website acquisition"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
web-listening = "web_listening.interfaces.cli:main"

[project.optional-dependencies]
rest = [
    "fastapi>=0.115",
]
mcp = [
    "anyio>=4.5",
    "mcp>=1.27.2,<2",
]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "pylint>=3.0",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "live: opt-in tests that access external runtimes or networks",
]

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pylint.main]
py-version = "3.12"
